[project]
name = "ultra_yolo_assistant"
version = "0.1.0"
description = "Ultralytics YOLO code assistant using RAG (Retrieval-Augmented Generation)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Talip Turkmen"}]

dependencies = [
    "pymongo>=4.5",
    "numpy>=1.23",
    "sentence-transformers>=2.2.2",
    "pydantic>=2.1",
    "pydantic-settings>=2.0",
    "requests>=2.28",
    "gradio>=3.32",
    "tiktoken>=0.4.0"
]

[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"
